name: DevSecOps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests unitaires et compilation
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Configurer Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Tester et compiler le backend
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B verify
      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Tester et compiler le frontend
        working-directory: frontend
        run: |
          npm ci
          npm run test -- --watch=false
          npm run build

  sast:
    name: SAST - Semgrep
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/security-audit

  secrets_scan:
    name: Scan de secrets - Gitleaks
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Un téléchargement interrompu sur le runner self-hosted peut laisser ce fichier.
      - name: Remove stale Gitleaks download
        run: rm -f /tmp/gitleaks.tmp
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  scan_dependencies:
    name: SCA - Trivy
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Configurer Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Resolve Maven dependencies
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B dependency:resolve dependency:resolve-plugins
      # Une vulnérabilité HIGH ou CRITICAL bloque systématiquement le pipeline.
      - name: Trivy filesystem scan - backend
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: backend
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: json
          output: trivy-backend-dependencies.json
          timeout: 15m
      - name: Upload backend SCA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-backend-dependencies
          path: trivy-backend-dependencies.json
          if-no-files-found: warn
      - name: Trivy filesystem scan - frontend
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: frontend
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: json
          output: trivy-frontend-dependencies.json
          timeout: 15m
      - name: Upload frontend SCA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-frontend-dependencies
          path: trivy-frontend-dependencies.json
          if-no-files-found: warn

  build:
    name: Build Docker images
    needs: [tests, sast, secrets_scan, scan_dependencies]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Prepare environment file
        run: cp .env.example .env
      - name: Build Docker images
        run: docker compose build

  docker_scan:
    name: Scan des images Docker
    needs: build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Trivy image scan - backend
        id: backend_image_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: student-management-devsecops-backend:latest
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: json
          output: trivy-backend-image.json
          timeout: 15m
          skip-files: '**/*.jar'
      - name: Upload backend image report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-backend-image
          path: trivy-backend-image.json
          if-no-files-found: warn
      - name: Trivy image scan - frontend
        id: frontend_image_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: student-management-devsecops-frontend:latest
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: json
          output: trivy-frontend-image.json
          timeout: 15m
      - name: Upload frontend image report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-frontend-image
          path: trivy-frontend-image.json
          if-no-files-found: warn
      - name: Enforce Docker image quality gate
        if: steps.backend_image_scan.outcome == 'failure' || steps.frontend_image_scan.outcome == 'failure'
        run: |
          echo 'Trivy detected HIGH or CRITICAL vulnerabilities. See the uploaded artifacts for details.'
          exit 1

  deploy_staging:
    name: Déploiement staging
    needs: docker_scan
    runs-on: self-hosted
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Prepare environment file
        run: cp .env.example .env
      - name: Deploy application in staging
        run: docker compose up -d

  dast:
    name: DAST - OWASP ZAP
    needs: deploy_staging
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Create report directory
        run: mkdir -p reports
      # Les alertes FAIL de ZAP rendent cette étape bloquante.
      - name: Run OWASP ZAP baseline scan
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}/reports:/zap/wrk/:rw" \
            zaproxy/zap-stable \
            zap-baseline.py -t http://127.0.0.1 -r zap-report.html -J zap-report.json -m 2
      - name: Upload DAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-report
          path: reports/
          if-no-files-found: warn

  deploy:
    name: Déploiement production
    # Une pull request ne peut jamais déployer en production.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: dast
    runs-on: self-hosted
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Prepare environment file
        run: cp .env.example .env
      - name: Deploy application
        run: docker compose up -d

name: DevSecOps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
  TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db:1

concurrency:
  group: devsecops-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests unitaires et compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurer Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Tester et compiler le backend
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B verify
      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Tester et compiler le frontend
        working-directory: frontend
        run: |
          npm ci
          npm run test -- --watch=false
          npm run build

  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep scan
        run: semgrep scan --config p/security-audit --error --json-output=semgrep-report.json --sarif-output=semgrep-report.sarif
      - name: Upload Semgrep reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: |
            semgrep-report.json
            semgrep-report.sarif
          if-no-files-found: warn

  secrets_scan:
    name: Scan de secrets - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Rapport Gitleaks (JSON)
        if: always()
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/repo" --entrypoint sh zricethezav/gitleaks:v8.18.4 \
            -c "git config --global --add safe.directory /repo && gitleaks detect --source /repo --report-format json --report-path /repo/gitleaks-report.json --exit-code 0"
      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: warn

  scan_dependencies:
    name: SCA - Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurer Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Resolve Maven dependencies
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B dependency:resolve dependency:resolve-plugins
      # Une vulnérabilité HIGH ou CRITICAL bloque systématiquement le pipeline.
      - name: Trivy filesystem scan - backend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: backend
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: json
          output: trivy-backend-dependencies.json
          timeout: 30m
      - name: Trivy HTML report - backend
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: backend
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: '0'
          format: template
          template: '@/contrib/html.tpl'
          output: trivy-backend-dependencies.html
      - name: Upload backend SCA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-backend-dependencies
          path: |
            trivy-backend-dependencies.json
            trivy-backend-dependencies.html
          if-no-files-found: warn
      - name: Trivy filesystem scan - frontend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: frontend
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: json
          output: trivy-frontend-dependencies.json
          timeout: 30m
      - name: Trivy HTML report - frontend
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: frontend
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: '0'
          format: template
          template: '@/contrib/html.tpl'
          output: trivy-frontend-dependencies.html
      - name: Upload frontend SCA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-frontend-dependencies
          path: |
            trivy-frontend-dependencies.json
            trivy-frontend-dependencies.html
          if-no-files-found: warn

  build:
    name: Build Docker images
    needs: [ tests, sast, secrets_scan, scan_dependencies ]
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: student-management-devsecops
    steps:
      - uses: actions/checkout@v4
      - name: Prepare environment file
        run: cp .env.example .env
      - name: Build Docker images
        run: docker compose build --pull
      - name: Save images
        run: |
          docker save student-management-devsecops-backend:latest student-management-devsecops-frontend:latest -o images.tar
      - name: Upload images artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: images.tar
          retention-days: 1

  docker_scan:
    name: Scan des images Docker
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download images artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-images
      - name: Load images
        run: docker load -i images.tar
      - name: Trivy image scan - backend
        id: backend_image_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: student-management-devsecops-backend:latest
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: json
          output: trivy-backend-image.json
          timeout: 30m
          skip-files: '**/*.jar'
      - name: Trivy HTML report - backend image
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: student-management-devsecops-backend:latest
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: '0'
          format: template
          template: '@/contrib/html.tpl'
          output: trivy-backend-image.html
          skip-files: '**/*.jar'
      - name: Upload backend image report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-backend-image
          path: |
            trivy-backend-image.json
            trivy-backend-image.html
          if-no-files-found: warn
      - name: Trivy image scan - frontend
        id: frontend_image_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: student-management-devsecops-frontend:latest
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: json
          output: trivy-frontend-image.json
          timeout: 30m
      - name: Trivy HTML report - frontend image
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: student-management-devsecops-frontend:latest
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: '0'
          format: template
          template: '@/contrib/html.tpl'
          output: trivy-frontend-image.html
      - name: Upload frontend image report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-frontend-image
          path: |
            trivy-frontend-image.json
            trivy-frontend-image.html
          if-no-files-found: warn
      - name: Trivy image scan - backend (table)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: student-management-devsecops-backend:latest
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: '0'
          format: table
          skip-files: '**/*.jar'
      - name: Trivy image scan - frontend (table)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: student-management-devsecops-frontend:latest
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: '0'
          format: table
      - name: Enforce Docker image quality gate
        if: steps.backend_image_scan.outcome == 'failure' || steps.frontend_image_scan.outcome == 'failure'
        run: |
          echo 'Trivy detected HIGH or CRITICAL vulnerabilities. See the uploaded artifacts for details.'
          exit 1

  dast:
    name: DAST - OWASP ZAP (staging)
    needs: docker_scan
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Prepare environment file
        run: cp .env.example .env
      - name: Start app (staging)
        run: |
          docker compose up -d --build
          sleep 40
          curl -sf http://127.0.0.1 || (docker compose logs && exit 1)
      - name: Create report directory
        run: mkdir -p reports && chmod 777 reports
      # Seules les alertes FAIL bloquent le pipeline; les WARN sont reportées sans bloquer.
      - name: Run OWASP ZAP baseline scan
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}/reports:/zap/wrk/:rw" \
            zaproxy/zap-stable \
            zap-baseline.py -t http://127.0.0.1 -r zap-report.html -J zap-report.json -m 2 -I
      - name: Upload DAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-report
          path: reports/
          if-no-files-found: warn

  deploy:
    name: Déploiement production
    # Une pull request ne peut jamais déployer en production.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: dast
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Prepare environment file
        run: cp .env.example .env
      - name: Deploy application
        run: docker compose up -d

  publish:
    name: Publish images to GHCR
    needs: [ build, docker_scan, dast ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download images artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-images

      - name: Load images
        run: docker load -i images.tar

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          for svc in backend frontend; do
            SRC=student-management-devsecops-$svc:latest
            DST=ghcr.io/$OWNER/student-management-devsecops-$svc
            docker tag $SRC $DST:latest
            docker tag $SRC $DST:${{ github.sha }}
            docker push $DST:latest
            docker push $DST:${{ github.sha }}
          done

  notify:
    name: Notification email
    needs: [tests, sast, secrets_scan, scan_dependencies, build, docker_scan, dast, deploy, publish]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Télécharger les rapports Trivy
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: trivy-*
          path: artifacts

      - name: Télécharger le rapport ZAP
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: zap-*
          path: artifacts

      - name: Construire l'email
        id: mail
        env:
          R_TESTS: ${{ needs.tests.result }}
          R_SAST: ${{ needs.sast.result }}
          R_SECRETS: ${{ needs.secrets_scan.result }}
          R_SCA: ${{ needs.scan_dependencies.result }}
          R_BUILD: ${{ needs.build.result }}
          R_DOCKER: ${{ needs.docker_scan.result }}
          R_DAST: ${{ needs.dast.result }}
          R_DEPLOY: ${{ needs.deploy.result }}
          R_PUBLISH: ${{ needs.publish.result }}
          COMMIT_MSG: ${{ github.event.head_commit.message || github.event.pull_request.title }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          ALL="$R_TESTS $R_SAST $R_SECRETS $R_SCA $R_BUILD $R_DOCKER $R_DAST $R_DEPLOY $R_PUBLISH"
          if echo "$ALL" | grep -q failure; then LABEL="ÉCHEC"; COLOR="#d73a49"
          elif echo "$ALL" | grep -q cancelled; then LABEL="ANNULÉ"; COLOR="#e36209"
          else LABEL="SUCCÈS"; COLOR="#2da44e"; fi
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"

          icon() {
            case "$1" in
              success) echo "✅ Réussi";;
              failure) echo "❌ Échec";;
              skipped) echo "⏭️ Ignoré";;
              cancelled) echo "⚠️ Annulé";;
              *) echo "$1";;
            esac
          }
          TD="padding:6px 12px;border-bottom:1px solid #eee"
          row() { echo "<tr><td style='$TD'>$1</td><td style='$TD'>$(icon "$2")</td></tr>"; }
          row_text() { echo "<tr><td style='$TD'>$1</td><td style='$TD'>$2</td></tr>"; }

          if [ "$R_DEPLOY" = "skipped" ] && [ "$EVENT" = "pull_request" ]; then
            DEPLOY_ROW=$(row_text "Déploiement" "⏭️ Ignoré (pull request, pas de déploiement)")
            PUBLISH_ROW=$(row_text "Publication des images (GHCR)" "⏭️ Ignoré (pull request)")
          else
            DEPLOY_ROW=$(row "Déploiement" "$R_DEPLOY")
            PUBLISH_ROW=$(row "Publication des images (GHCR)" "$R_PUBLISH")
          fi

          # Étapes en échec
          FAILED=""
          check() {
            if [ "$2" = "failure" ]; then FAILED="$FAILED<li>$1</li>"; fi
          }
          check "Tests unitaires" "$R_TESTS"
          check "SAST (Semgrep)" "$R_SAST"
          check "Scan de secrets (Gitleaks)" "$R_SECRETS"
          check "SCA (Trivy)" "$R_SCA"
          check "Build Docker" "$R_BUILD"
          check "Scan des images Docker" "$R_DOCKER"
          check "DAST (OWASP ZAP)" "$R_DAST"
          check "Déploiement" "$R_DEPLOY"
          check "Publication des images (GHCR)" "$R_PUBLISH"

          if [ -n "$FAILED" ]; then
            FAIL_BOX="<div style='background:#ffebe9;border:1px solid #d73a49;border-radius:6px;padding:10px 14px;margin:12px 0'><b>Étapes bloquantes :</b><ul style='margin:6px 0 0;padding-left:20px'>$FAILED</ul></div>"
            GATE="❌ Quality gate : déploiement bloqué, corrigez les points ci-dessus."
          elif [ "$LABEL" = "SUCCÈS" ]; then
            FAIL_BOX=""
            GATE="✅ Quality gate : aucune vulnérabilité critique ou haute détectée."
          else
            FAIL_BOX=""
            GATE="⚠️ Pipeline annulé avant la fin des contrôles."
          fi

          # Comptage Trivy
          trivy_count() {
            if [ -f "$1" ]; then
              jq '[.Results[]?.Vulnerabilities[]?] | length' "$1" 2>/dev/null || echo "n/a"
            else
              echo "n/a"
            fi
          }
          F_TB=artifacts/trivy-backend-dependencies/trivy-backend-dependencies.json
          F_TF=artifacts/trivy-frontend-dependencies/trivy-frontend-dependencies.json
          F_IB=artifacts/trivy-backend-image/trivy-backend-image.json
          F_IF=artifacts/trivy-frontend-image/trivy-frontend-image.json
          T_BACK=$(trivy_count "$F_TB")
          T_FRONT=$(trivy_count "$F_TF")
          I_BACK=$(trivy_count "$F_IB")
          I_FRONT=$(trivy_count "$F_IF")

          # Tableau des CVE (10 lignes max)
          cve_rows() {
            for f in "$@"; do
              if [ -f "$f" ]; then
                jq -r --arg s "padding:4px 8px;border-bottom:1px solid #eee" \
                  '.Results[]?.Vulnerabilities[]? | "<tr><td style=\"\($s)\">\(.VulnerabilityID)</td><td style=\"\($s)\">\(.PkgName)</td><td style=\"\($s)\">\(.Severity)</td><td style=\"\($s)\">\(.InstalledVersion)</td><td style=\"\($s)\">\(.FixedVersion // "-")</td></tr>"' "$f" 2>/dev/null || true
              fi
            done
          }
          CVE_ROWS=$(cve_rows "$F_TB" "$F_TF" "$F_IB" "$F_IF" | head -n 10)
          if [ -n "$CVE_ROWS" ]; then
            CVE_SECTION="<h3 style='margin:16px 0 6px'>Vulnérabilités détectées (10 premières)</h3><table style='border-collapse:collapse;width:100%;font-size:12px'><tr style='background:#f6f8fa;text-align:left'><th style='padding:4px 8px'>CVE</th><th style='padding:4px 8px'>Paquet</th><th style='padding:4px 8px'>Sévérité</th><th style='padding:4px 8px'>Installée</th><th style='padding:4px 8px'>Corrigée</th></tr>$CVE_ROWS</table>"
          else
            CVE_SECTION=""
          fi

          # Détail ZAP
          ZAP_FILE=artifacts/zap-dast-report/zap-report.json
          ZAP_TOTAL="n/a"; ZAP_H="n/a"; ZAP_M="n/a"; ZAP_L="n/a"; ZAP_I="n/a"; ZAP_LIST=""
          if [ -f "$ZAP_FILE" ]; then
            ZAP_TOTAL=$(jq '[.site[]?.alerts[]?] | length' "$ZAP_FILE" 2>/dev/null || echo "n/a")
            ZAP_H=$(jq '[.site[]?.alerts[]? | select(.riskcode=="3")] | length' "$ZAP_FILE" 2>/dev/null || echo "n/a")
            ZAP_M=$(jq '[.site[]?.alerts[]? | select(.riskcode=="2")] | length' "$ZAP_FILE" 2>/dev/null || echo "n/a")
            ZAP_L=$(jq '[.site[]?.alerts[]? | select(.riskcode=="1")] | length' "$ZAP_FILE" 2>/dev/null || echo "n/a")
            ZAP_I=$(jq '[.site[]?.alerts[]? | select(.riskcode=="0")] | length' "$ZAP_FILE" 2>/dev/null || echo "n/a")
            ZAP_LIST=$(jq -r '.site[]?.alerts[]? | "<li>\(.name) <i>(\(.riskdesc | split(" ")[0]))</i></li>"' "$ZAP_FILE" 2>/dev/null | head -n 8 || true)
          fi
          if [ -n "$ZAP_LIST" ]; then
            ZAP_DETAIL="<ul style='margin:4px 0 0;padding-left:20px;font-size:13px;color:#555'>$ZAP_LIST</ul>"
          else
            ZAP_DETAIL=""
          fi

          # Pièces jointes
          ATT=""
          for f in artifacts/zap-dast-report/zap-report.html "$F_TB" "$F_TF" "$F_IB" "$F_IF"; do
            if [ -f "$f" ]; then ATT="$ATT,$f"; fi
          done
          echo "attach=${ATT#,}" >> "$GITHUB_OUTPUT"

          MSG=$(printf '%s' "$COMMIT_MSG" | head -n1 | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          WHEN=$(TZ=Africa/Tunis date '+%d/%m/%Y à %H:%M')

          cat > mail.html <<EOF
          <div style="font-family:Segoe UI,Arial,sans-serif;max-width:660px;margin:auto;border:1px solid #ddd;border-radius:8px;overflow:hidden">
            <div style="background:$COLOR;color:#fff;padding:16px 20px">
              <div style="font-size:20px;font-weight:bold">Pipeline DevSecOps : $LABEL</div>
              <div style="font-size:13px;opacity:.9">$REPO · $BRANCH</div>
            </div>
            <div style="padding:16px 20px;font-size:14px;color:#333">
              <p style="margin:0 0 4px"><b>Commit :</b> <a href="$COMMIT_URL">${SHA:0:7}</a> — $MSG</p>
              <p style="margin:0 0 4px"><b>Auteur :</b> $ACTOR</p>
              <p style="margin:0 0 8px"><b>Événement :</b> $EVENT</p>
              $FAIL_BOX
              <p style="margin:8px 0;font-weight:bold">$GATE</p>
              <h3 style="margin:16px 0 6px">Étapes du pipeline</h3>
              <table style="border-collapse:collapse;width:100%;font-size:14px">
                $(row "Tests unitaires" "$R_TESTS")
                $(row "SAST (Semgrep)" "$R_SAST")
                $(row "Scan de secrets (Gitleaks)" "$R_SECRETS")
                $(row "SCA (Trivy)" "$R_SCA")
                $(row "Build Docker" "$R_BUILD")
                $(row "Scan des images Docker" "$R_DOCKER")
                $(row "DAST (OWASP ZAP)" "$R_DAST")
                $DEPLOY_ROW
                $PUBLISH_ROW
              </table>
              <h3 style="margin:16px 0 6px">Résumé sécurité</h3>
              <ul style="margin:0;padding-left:20px">
                <li>Dépendances HIGH/CRITICAL : backend <b>$T_BACK</b>, frontend <b>$T_FRONT</b></li>
                <li>Images Docker HIGH/CRITICAL : backend <b>$I_BACK</b>, frontend <b>$I_FRONT</b></li>
                <li>Alertes ZAP : <b>$ZAP_TOTAL</b> (High : <b>$ZAP_H</b>, Medium : <b>$ZAP_M</b>, Low : <b>$ZAP_L</b>, Info : <b>$ZAP_I</b>)</li>
              </ul>
              $ZAP_DETAIL
              $CVE_SECTION
              <p style="margin:20px 0 0"><a href="$RUN_URL" style="background:$COLOR;color:#fff;padding:10px 16px;border-radius:6px;text-decoration:none">Voir le run complet</a></p>
              <p style="margin:16px 0 0;font-size:12px;color:#888">Envoyé le $WHEN (heure de Tunis). Rapports en pièces jointes.</p>
            </div>
          </div>
          EOF

      - name: Envoyer l'email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[DevSecOps] ${{ steps.mail.outputs.label }} - ${{ github.repository }} (${{ github.head_ref || github.ref_name }})"
          to: farajchaima8@gmail.com
          from: DevSecOps Pipeline <${{ secrets.MAIL_USERNAME }}>
          html_body: file://mail.html
          attachments: ${{ steps.mail.outputs.attach }}
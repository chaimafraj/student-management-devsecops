<div class="container">
  <h1>Recherche d'un étudiant</h1>

  <div class="search-card">
    <input [(ngModel)]="searchTerm" placeholder="Rechercher par nom, email ou note..." (keyup.enter)="onSearch()">
    <button (click)="onSearch()">Rechercher</button>
  </div>

  @if (results.length > 0) {
    <table>
      <thead>
      <tr><th>ID</th><th>Nom</th><th>Email</th><th>Note</th></tr>
      </thead>
      <tbody>
      @for (s of results; track s.id) {
        <tr>
          <td>{{ s.id }}</td>
          <td>{{ s.nom }}</td>
          <td>{{ s.email }}</td>
          <td>{{ s.note }}</td>
        </tr>
      }
      </tbody>
    </table>
  }

  @if (searched && results.length === 0) {
    <div class="empty-msg">Aucun résultat trouvé.</div>
  }
</div>

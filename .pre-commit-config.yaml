default_stages: [pre-commit]
fail_fast: false

repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: Gitleaks - secrets in staged files
        entry: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/security/gitleaks.ps1
        language: system
        pass_filenames: false

      - id: semgrep
        name: Semgrep - SAST (Java and TypeScript)
        entry: semgrep --config .semgrep.yml --error --severity ERROR
        language: system
        types_or: [java, ts, tsx, javascript]

      - id: maven-dependency-check
        name: OWASP Dependency-Check - Maven (critical CVEs)
        entry: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/security/maven-dependency-check.ps1
        language: system
        pass_filenames: false
        always_run: true

      - id: npm-audit
        name: npm audit - Angular production dependencies (critical CVEs)
        entry: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/security/npm-audit.ps1
        language: system
        pass_filenames: false
        always_run: true